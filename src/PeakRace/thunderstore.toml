[config]
schemaVersion = "0.0.2"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "Raiderj9"
name = "RaceToThePeak"
description = "Adds teams and racing to PEAK"
websiteUrl = "https://github.com/Raiderj9/RaceToThePEAK"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.75301"

[build]
icon = "../../Icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/PeakRace/release/RaceToThePeak.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "peak", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/peak/category/
peak = [ "mods", ]
